; OptiScaler 配置 (简体中文版模板)
; 此文件是 OptiScaler.ini 的中文注释版本。
; 使用方式: 将本文件另存为 OptiScaler.ini 覆盖原文件 (或直接编辑原文件)。
; 配置项名 (section 名和键名) 保持英文不变, 只有注释被翻译。
; -------------------------------------------------------
[Upscalers]
; -------------------------------------------------------
; 选择 Dx11 游戏的放大算法
; fsr22 (原生 DX11), fsr31 (原生 DX11), xess (原生 DX11, 仅限 Arc), xess_12 (dx11on12), fsr21_12 (dx11on12), fsr22_12 (dx11on12), ffx_12 (FSR 2.3; 3.1; 4.x), dlss - 默认 (auto) 为 fsr22
Dx11Upscaler=auto

; 选择 Dx12 游戏的放大算法
; xess, fsr21, fsr22, ffx (FSR 2.3; 3.1; 4.x), dlss
; 默认 (auto) 为: 显卡支持时用 DLSS, 显卡支持时用 FSR4, 否则用 XeSS
Dx12Upscaler=auto

; 选择 Vulkan 游戏的放大算法
; fsr21 (原生 VK), fsr22 (原生 VK), ffx (原生 FSR 2.3; 3.1), xess (原生 VK), fsr21_12 (VKon12), ffx_12 (FSR 2.3; 3.1; 4.x), dlss - 默认 (auto) 为 fsr22
VulkanUpscaler=auto



; -------------------------------------------------------
[FrameGen]
; -------------------------------------------------------
; 启用帧生成 (Frame Generation)
; true 或 false - 默认 (auto) 为 false
Enabled=auto

; 选择的 FG 输入/来源
; dlssg    - 可搭配任意 FG 输出使用。原生支持 Hudless。仅限使用 Streamline 和 DLSSG 的游戏
; nvngxfg  - 仅限 FSR 3 FG (使用 DLSS Enabler dll 的 MFG)。游戏内需要 DLSSG。原生支持 Hudless。使用 Streamline swapchain 做帧节奏。
; fsrfg    - 可搭配任意 FG 输出使用。原生支持 Hudless。
; upscaler - 必须启用放大算法。可搭配任意 FG 输出使用, 但部分组合可能不完美。为防止 UI 错乱, 需要 Hudfix
; fsrfg30  - 可搭配任意 FG 输出使用。原生支持 Hudless。
; nofg, dlssg, nvngxfg, fsrfg, upscaler, fsrfg30 - 默认 (auto) 为 nofg
FGInput=auto

; 选择的 FG 输出
; fsrfg          - 需要 amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll
; xefg           - 需要 libxess_fg.dll 和 libxell.dll
; dlssg          - 需要 'OptiScaler/streamline' 文件夹内的 streamline dll + nvngx_dlssg.dll
; nofg, fsrfg, xefg, dlssg - 默认 (auto) 为 nofg
FGOutput=auto

; 选择的 FG Nvngx 替换
; Nvngx FG 是底层的 DLSSG 提供器。只有使用 FGInput=NvngxFG 或 FGOutput=DLSSG 时此设置才生效
; 例如在只有放大算法的游戏中使用 Nukems: FGInput=upscaler, FGOutput=dlssg, FGNvngxReplacement=Nukems
; 在已支持 DLSSG 的游戏中使用 Arturs: FGInput=nvngxfg, FGOutput=auto, FGNvngxReplacement=Arturs
; None      - 不替换
; Nukems    - 需要 dlssg_to_fsr3_amd_is_better.dll, FSR 3 FG
; Arturs    - 需要 dlss-enabler-headless.dll, FSR 3 MFG
; FFX       - 需要 amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll, FSRFG 3 或 4
; Combo     - 需要 FFX 和 Arturs 各自要求的文件, 中间帧用 FFX, 其余用 Enabler。可在 4x 和 6x 模式下组合 FSR 4 FG 和 Enabler
; None, Nukems, Arturs, FFX, Combo - 默认 (auto) 为 None
FGNvngxReplacement=auto

; 帧时间来源, 会影响帧节奏
; 0: 输入 (DLSSG/FSRFG/OptiFG) | 1: 两次 Present 调用之间的时间 | 2: 零 (仅限 XeFG)
; true 或 false - 默认 (auto) 为 0
FTInput=auto

; 启用帧生成调试视图
; true 或 false - 默认 (auto) 为 false
DebugView=auto

; 在 FG 上方绘制 UI, 需要 Hudless 和一张 UI 纹理, 主要用于 FSR FG
; true 或 false - 默认 (auto) 为 false
DrawUIOverFG=auto

; 设置提供的 UI 纹理类型, 配合 DrawUIOverFG + FSR FG 会改变 UI 外观
; true 或 false - 默认 (auto) 为 true
UIPremultipliedAlpha=auto

; 控制 Hudless, 即使 FG 来源提供了也覆盖
; true 或 false - 默认 (auto) 为 false
DisableHudless=auto

; 控制 UI 纹理, 即使 FG 来源提供了也覆盖
; true 或 false - 默认 (auto) 为 true
DisableUI=auto

; 忽略来自 FG 输入的 Reset 信号
; true 或 false - 默认 (auto) 为 false
SkipReset=auto

; 定义 FG 矩形区域
; 整数值 - 默认 (auto) 为整个屏幕
RectLeft=auto
RectTop=auto
RectWidth=auto
RectHeight=auto

; 允许 FG 领先游戏的帧数
; 可能防止 FG 开/关切换, 但也可能引发问题
; 1 到 3 - 默认 (auto) 为 1
AllowedFrameAhead=auto

; 始终将 Depth 标记为 ValidNow
; 会多用显存, 但 Uniscaler 需要
; true 或 false - 默认 (auto) 为 false
DepthValidNow=auto

; 始终将 Velocity 标记为 ValidNow
; 会多用显存, 但 Uniscaler 需要
; true 或 false - 默认 (auto) 为 false
VelocityValidNow=auto

; 始终将 Hudless 标记为 ValidNow
; 会多用显存, 但 Uniscaler 需要
; true 或 false - 默认 (auto) 为 false
HudlessValidNow=auto

; 如果来源标记了多个 hudless, 只使用第一个
; true 或 false - 默认 (auto) 为 false
OnlyAcceptFirstHudless=auto

; 保留 FG swapchain 并阻止其释放
; 可能防止释放 swapchain 时崩溃
; true 或 false - 默认 (auto) 为 true
PreserveSwapChain=auto

; 跳过对 swapchain 的 ResizeBuffers 调用
; 当新旧描述相同时
; 防止 ResizeBuffers 调用后的崩溃
; true 或 false - 默认 (auto) 为 true
SkipResizeBuffers=auto

; 通常 ResizeBuffers 调用后 swapchain 缓冲区
; 应处于 COMMON 状态, 启用此选项时
; OptiScaler 会尝试设置 swapchain 缓冲区状态
; 在跳过 ResizeBuffers 调用时
; 可能引起崩溃, 也可能修复崩溃
; true 或 false - 默认 (auto) 为 false
ModifyBufferState=auto

; 通常 ResizeBuffers 调用后 swapchain 当前索引
; 应为 0, 启用此选项时
; OptiScaler 会通过调用 present 尝试将 swapchain 索引
; 设置到索引变为 0
; 可能引起崩溃, 也可能修复崩溃
; true 或 false - 默认 (auto) 为 false
ModifySCIndex=auto

; 裁剪 UI 的透明度以帮助插值
; 仅在 FSR FG 输出和 NvngxFG 下有效
; 0.0 - 1.0 - 默认 (auto) 为 0.0, 除非已知能修复某个游戏
HudCutoff=auto



; -------------------------------------------------------
[FSRFG]
; -------------------------------------------------------
; 启用 FSR3.1 帧生成撕裂线 (Tear Lines)
; true 或 false - 默认 (auto) 为 false
DebugTearLines=auto

; 启用 FSR3.1 帧生成插值跳过线
; true 或 false - 默认 (auto) 为 false
DebugResetLines=auto

; 启用 FSR3.1 帧生成节奏线 (Pacing Lines)
; true 或 false - 默认 (auto) 为 false
DebugPacingLines=auto

; 启用异步 FSR3.1 帧生成
; true 或 false - 默认 (auto) 为 false
AllowAsync=auto

; 在 FG swapchain 的 present 调用中使用互斥锁
; 禁用可能以牺牲稳定性为代价提升性能
; true 或 false - 默认 (auto) 为 true
UseMutexForSwapchain=auto

; 帧节奏调优
; -------------------------------------------------------
; 启用自定义帧节奏调优参数
; true 或 false - 默认 (auto) 为 true
FramePacingTuning=auto

; 此信息来自:
; https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/blob/54fbaafdc34716811751bea5032700e78f5a0f33/ffx-api/include/ffx_api/ffx_api_types.h#L197
;
; 默认调优
; safetyMarginInMs==0.1ms 且 varianceFactor==0.1。
; 
; 调优组 A
; safetyMarginInMs==0.75ms, 且 varianceFactor==0.1。
;
; 调优组 B
; safetyMarginInMs==0.01ms 且 varianceFactor==0.3。
;
; 如果你的游戏使用 FG 时, 在场景从复杂逐渐过渡到简单的过程中帧率意外偏低,
; 可以试试设置 "调优组 B", 以略高的方差为代价找回丢失的 FPS。
;
; OptiScaler 默认使用调优 B

; 帧节奏调优
; 设置安全余量
; 浮点数 - 默认 (auto) 为 0.01
FPTSafetyMarginInMs=auto

; 帧节奏调优
; 设置方差因子
; 0.0 - 1.0 - 默认 (auto) 为 0.3
FPTVarianceFactor=auto

; 帧节奏调优
; 允许帧节奏自旋锁休眠, 应能降低 CPU 占用
; 可能导致 FPS 上升变慢
; true 或 false - 默认 (auto) 为 false
FPTHybridSpin=auto

; 帧节奏调优
; 当 FPTHybridSpin 为 true 时自旋多久。以定时器分辨率单位计量。
; 不建议低于 2, 否则会导致频繁过冲
; 无符号整数 - 默认 (auto) 为 2
FPTHybridSpinTime=auto

; 帧节奏调优
; 允许用 WaitForSingleObject 代替自旋等待 fence 值
; true 或 false - 默认 (auto) 为 false
FPTWaitForSingleObjectOnFence=auto

; 启用 FSR-FG Redstone 水印
; true 或 false - 默认 (auto) 为 false
EnableWatermark=auto



; -------------------------------------------------------
[XeFG]
; -------------------------------------------------------
; 跳过 XeFG 的 ini 预检查
; 可能导致画质变差或崩溃!
; true 或 false - 默认 (auto) 为 false
IgnoreInitChecks=auto

; 设置插值帧数 (MFG)
; 1 = 2X | 2 = 3X | 3 = 4X
; true 或 false - 默认 (auto) 为 1
InterpolationCount=auto

; XeFG DepthInverted 标志
; true 或 false - 默认 (auto) 为 true
DepthInverted=auto

; 禁用 UI 插值
; 仅在提供 hudless 时有效
; true 或 false - 默认 (auto) 为 false
UIComposition=auto

; XeFG JitteredMV 标志
; true 或 false - 默认 (auto) 为 false
JitteredMV=auto

; XeFG HighResMV 标志
; true 或 false - 默认 (auto) 为 false
HighResMV=auto

; 启用 XeFG 调试方块
; true 或 false - 默认 (auto) 为 false
DebugView=auto

; 强制使用无边框模式代替独占全屏
; 模式切换时可能引起稳定性问题
; 或者当独占全屏模式小于
; 显示器分辨率时引起画质问题
; true 或 false - 默认 (auto) 为 false
ForceBorderless=auto



; -------------------------------------------------------
[DLSSG]
; -------------------------------------------------------
; 设置插值帧数 (MFG)
; 1 = 2X | 2 = 3X | 3 = 4X | 4 = 5X | 5 = 6X
; true 或 false - 默认 (auto) 为 1
InterpolationCount=auto

; 默认 (auto) 为 true
UseGamesReflexMarkers=auto

; 用于覆盖游戏发送给 SL 的值, 可能是 Nvngx FG, 当使用真 DLSSG 时也可能是 noFG
; 默认 (auto) 为不覆盖
OverrideInterpolationCount=auto

; 尝试在游戏原生 DLSSG 中强制 Dynamic MFG。需要 Nvidia Blackwell 或任意 AMD/Intel (Nvngx FG)
; 需要 Streamline 2.11
; 默认 (auto) 为 false
OverrideForceDMFG=auto

; 在 Opti 自己的 DLSSG 输出中强制 Dynamic MFG。需要 Nvidia Blackwell 或任意 AMD/Intel (Nvngx FG)
; 需要 Streamline 2.11
; 默认 (auto) 为 false
ForceDMFG=auto


; 设置动态多帧生成的目标 FPS
; 非零时将无法手动调整 FG 倍数
; 需要启用 DMFG
; 默认 (auto) 为 0.0 (显示器刷新率)
FramerateTargetDMFG=auto



; -------------------------------------------------------
[OptiFG]
; -------------------------------------------------------

; 禁用 HUDFix 资源跟踪
; 同时在使用以下 ML 帧生成器时
; 降低 CPU 开销 (这些生成器会处理 HUD 元素)
; true 或 false - 默认 (auto) 为 false
DisableHUDFix=auto

; 为帧生成启用 HUDFix Hudless 跟踪
; 可能引起崩溃, 尤其是配合 Async 时
; true 或 false - 默认 (auto) 为 false
HUDFix=auto

; 延迟 HUDless 图像捕获
; 可能引起崩溃, 尤其是设置过高时!
; 大于 0 的整数值 - 默认 (auto) 为 1
HUDLimit=auto

; 扩展 HUDless 检查以支持更多图像格式
; 可能引起崩溃和卡顿。
; true 或 false - 默认 (auto) 为 false
HUDFixExtended=auto

; 资源跟踪不使用 CreateRenderTargetView
; true 或 false - 默认 (auto) 为 false
HudfixDisableRTV=auto

; 资源跟踪不使用 CreateShaderResourceView
; true 或 false - 默认 (auto) 为 false
HudfixDisableSRV=auto

; 资源跟踪不使用 CreateUnorderedAccessView
; true 或 false - 默认 (auto) 为 false
HudfixDisableUAV=auto

; 资源跟踪不使用 OMSetRenderTargets
; true 或 false - 默认 (auto) 为 false
HudfixDisableOM=auto

; 资源跟踪不使用 SetComputeRootDescriptorTable
; true 或 false - 默认 (auto) 为 true
HudfixDisableSCR=auto

; 资源跟踪不使用 SetGraphicsRootDescriptorTable
; true 或 false - 默认 (auto) 为 true
HudfixDisableSGR=auto

; 资源跟踪不使用 DrawInstanced
; true 或 false - 默认 (auto) 为 false
HudfixDisableDI=auto

; 资源跟踪不使用 DrawIndexedInstanced
; true 或 false - 默认 (auto) 为 false
HudfixDisableDII=auto

; 资源跟踪不使用 Dispatch
; true 或 false - 默认 (auto) 为 false
HudfixDisableDispatch=auto

; 阻止 swapchain 缓冲区被用作 Hudless
; 可能有助于修复覆盖层问题, 但也可能降低兼容性
; true 或 false - 默认 (auto) 为 false
HUDFixDontUseSwapchainBuffers=auto

; 将 Hudless 的分辨率检查放宽 32 像素
; 有助于使用黑边的游戏在部分分辨率和屏幕比例下正常工作 (例如巫师3)
; true 或 false - 默认 (auto) 为 false
HUDFixRelaxedResolutionCheck=auto

; 在着色器执行前捕获资源。
; 提高 hudless 捕获几率, 但可能会捕获到不必要的资源。
; true 或 false - 默认 (auto) 为 false
HUDFixImmediate=auto

; 无论 Hudfix 设置如何, 资源跟踪始终启用
; 可能引起性能问题, 但禁用可能引起稳定性问题
; true 或 false - 默认 (auto) 为 false
AlwaysTrackHeaps=auto

; 跟踪资源时使用分片代替单一互斥锁
; 可能提升重度多线程游戏的性能
; true 或 false - 默认 (auto) 为 false
UseShards=auto

; 阻止很少使用的资源被用作 hudless
; 以防止闪烁等问题
; true 或 false - 默认 (auto) 为 false
ResourceBlocking=auto

; 复制一份 Depth 供 Hudfix FG 调用使用
; 设为 false 很可能导致偶尔的画面错乱
; true 或 false - 默认 (auto) 为 true
MakeDepthCopy=auto

; 按 DepthScaleMax 值缩放深度缓冲区
; 修复 DLSS-D + UE 的损坏深度缓冲区信息
; true 或 false - 默认 (auto) 为 false
EnableDepthScale=auto

; EnableDepthScale 的缩放值
; 深度值将除以该值
; 浮点数 - 默认 (auto) 为 10000.0
DepthScaleMax=auto

; 复制一份运动向量供 Hudfix FG 调用使用
; 设为 false 很可能导致偶尔的画面错乱
; true 或 false - 默认 (auto) 为 true
MakeMVCopy=auto

; 翻转 Depth 和 Velocity 纹理
; 这应该能修复 OptiFG 在 Unity 游戏中的问题
; true 或 false - 默认 (auto) 为 false
ResourceFlip=auto

; 按插值区域翻转 Depth 和 Velocity 纹理
; 这应该能修复 OptiFG 在 Unity 游戏中的问题
; true 或 false - 默认 (auto) 为 false
ResourceFlipOffset=auto

; 始终捕获并将 FSR-FG 3.1 swapchain 与所选输出交换
; 这应该能修复以下问题:
; 游戏创建了但未使用 FSR-FG swapchain (寂静岭 f)
; true 或 false - 默认 (auto) 为 false
AlwaysCaptureFSRFGSwapchain=auto



; -------------------------------------------------------
[Inputs]
; -------------------------------------------------------
; OptiScaler 将 hook (nvngx.dll) 并使用 Dlss 输入
; true 或 false - 默认 (auto) 为 true
EnableDlssInputs=auto

; OptiScaler 将 hook (libxess.dll) 并使用 XeSS 输入
; true 或 false - 默认 (auto) 为 true
EnableXeSSInputs=auto

; OptiScaler 将 hook Fsr2 输入
; true 或 false - 默认 (auto) 为 true
EnableFsr2Inputs=auto

; OptiScaler 将 hook Fsr2 Dx11 输入代替 Dx12 输入
; true 或 false - 默认 (auto) 为 false
UseFsr2Dx11Inputs=auto

; OptiScaler 将 hook Fsr2 Vulkan 输入代替 Dx11 和 Dx12 输入
; true 或 false - 默认 (auto) 为 false
UseFsr2VulkanInputs=auto

; OptiScaler 将使用 Fsr2 输入
; true 或 false - 默认 (auto) 为 true
UseFsr2Inputs=auto

; 尝试用模式匹配查找 FSR2 方法
; 会拖慢游戏加载
; true 或 false - 默认 (auto) 为 false
Fsr2Pattern=auto

; OptiScaler 将 hook Fsr3 输入
; true 或 false - 默认 (auto) 为 true
EnableFsr3Inputs=auto

; OptiScaler 将使用 Fsr3 输入
; true 或 false - 默认 (auto) 为 true
UseFsr3Inputs=auto

; 尝试用模式匹配查找 FSR3 方法
; 会拖慢游戏加载
; true 或 false - 默认 (auto) 为 false
Fsr3Pattern=auto

; OptiScaler 将 hook FidelityFX (amd_fidelityfx_dx12.dll) API 输入
; true 或 false - 默认 (auto) 为 true
EnableFfxInputs=auto

; OptiScaler 将使用 FidelityFX API 输入
; true 或 false - 默认 (auto) 为 true
UseFfxInputs=auto

; 在游戏自带 FSR3.1 放大算法与 OptiScaler 所选放大算法之间热切换
; true 或 false - 默认 (auto) 为 false
EnableHotSwapping=auto



; -------------------------------------------------------
[FSRFGInputs]
; -------------------------------------------------------
; 不使用 ffxConfig 中设置的 Hudless
; true 或 false - 默认 (auto) 为 false
SkipConfigForHudless=auto

; 不使用 ffxDispatch 中设置的 Hudless
; true 或 false - 默认 (auto) 为 false
SkipDispatchForHudless=auto



; -------------------------------------------------------
[Framerate]
; -------------------------------------------------------
; 尽可能使用 Reflex 的帧率限制
; 包括 XeLL 或 AntiLag 2 等任何替代 Reflex 的技术
; 浮点数 - 默认 (auto) 为 0.0 (禁用)
FramerateLimit=auto



; -------------------------------------------------------
[XeSS]
; -------------------------------------------------------
; 在初始化前为 XeSS 构建管线
; true 或 false - 默认 (auto) 为 true
BuildPipelines=auto 

; 在初始化前为 XeSS 创建堆对象
; true 或 false - 默认 (auto) 为 true
CreateHeaps=auto 

; 选择 XeSS 网络模型
; 目前似乎不起作用
; 0 = KPSS | 1 = Splat | 2 = Model 3 | 3 = Model 4 | 4 = Model 5 | 5 = Model 6
; 默认 (auto) 为 0
NetworkModel=auto



; -------------------------------------------------------
[FSR]
; -------------------------------------------------------
; 为 FSR 和 FSR FG 设置相机垂直 FOV 值
; 0.0 到 180.0 - 默认 (auto) 为 60.0
VerticalFov=auto

; 如果未定义垂直 FOV, 将用它来计算垂直 FOV
; 0.0 到 180.0 - 默认 (auto) 为关闭
HorizontalFov=auto

; 为 FSR 和 FSR FG 设置相机近裁剪面值
; 0.0 到浮点数最大值 - 默认 (auto) 为 0.1
CameraNear=auto

; 为 FSR 和 FSR FG 设置相机远裁剪面值
; 0.0 到浮点数最大值 - 默认 (auto) 为 10000.0
CameraFar=auto

; 启用相机值 (近裁剪面, 远裁剪面, FOV) 的使用
; 即从 FSR2/3 或 FFX 输入接收到的值
; true 或 false - 默认 (auto) 为 true
UseFsrInputValues=auto

; 为 FSR3.X 放大算法启用调试视图
; true 或 false - 默认 (auto) 为 false
DebugView=auto

; 为 FSR3.X/4 选择放大算法后端
; 0 = FSR 4.0.2 | 1 = FSR 3.1.5 | 2 = FSR 2.3.4
; 取决于显卡 - 默认 (auto) 为 0 - RDNA4 用 FSR4, 其余用 FSR3
UpscalerIndex=auto

; 为 FFX 选择 FG 后端
; 0 = FSR 4.0.0 | 1 = FSR 3.1.6
; 取决于显卡 - 默认 (auto) 为 0 - RDNA4 用 FSR4, 其余用 FSR3
FGIndex=auto

; 为 FSR3.1.1 及以上设置 Velocity Factor
; 值为 0.0f 可提升亮部像素的时域稳定性。
; 0.0 到 1.0 - 默认 (auto) 为 1.0
VelocityFactor=auto

; 为 FSR3.1.4 及以上设置 Reactiveness Scale
; 用于开发目的, 测试向 reactive mask 写入更大值是否能减少鬼影
; 0.0 到无穷大 - 默认 (auto) 为 1.0
ReactiveScale=auto

; 为 FSR3.1.4 及以上设置 Shading Scale
; 增大此值会放大 fsr3.1 计算出的着色变化值 (读取时), 以获得更高的反应性。
; 0.0 到无穷大 - 默认 (auto) 为 1.0
ShadingScale=auto

; 为 FSR3.1.4 及以上设置每帧累加量
; 对应发生遮挡解除的像素坐标处, 或 reactive mask 值 > 0.0f 时, 每帧添加的累加量。
; 减小此值, 并将出现鬼影的物体 (即无 mv 处) 以接近 1.0f 的值画到 reactive mask, 可减少时域鬼影。
; 减小此值可能导致更多细线特征像素闪烁。
; 0.0 到 1.0 - 默认 (auto) 为 0.333
AccAddPerFrame=auto

; 为 FSR3.1.4 及以上设置最小遮挡解除累加量
; 增大此值可能减少白色像素在频繁互相遮挡解除的摇摆细线物体周围的时域闪烁。
; 值过高可能增加鬼影。足够负的值意味着对于第 N 帧发生遮挡解除的像素坐标,
; 从第 N+2 帧开始添加 fAccumulationAddedPerFrame。
; -1.0 到 1.0 - 默认 (auto) 为 -0.333
MinDisOccAcc=auto

; 将原始 DLSS reactive mask 用作透明度遮罩
; true 或 false - 默认 (auto) 为 true
UseReactiveMaskForTransparency=auto

; 与 FSR 配合使用时应用 DLSS reactive mask 的偏置
; 值越高, 新帧的偏置越大
; 0.0 - 0.9 - 默认 (auto) 为 0.45
DlssReactiveMaskBias=auto

; 强制 Opti 尝试使用特定的 FSR 4 模型
; 别自欺欺人: 在不支持的显卡上强制 FP8, 驱动会回退到 FSR 3
; 0 = 不覆盖 | 1 = FP8 | 2 = INT8
; 0 到 2 - 默认 (auto) 为 0
Fsr4ForceModel=auto

; 选择要使用的内部 FSR4 预设
; 0 = 用于 FSR 原生 AA, 1 = 超高质量/质量, 2 = 平衡, 3 = 性能, 4 = DRS, 5 = 极致性能
; 0 到 5 - 默认 (auto) 为游戏默认
Fsr4Preset=auto

; 启用 FSR4 水印
; true 或 false - 默认 (auto) 为 false
Fsr4EnableWatermark=auto

; 阻止 OptiScaler 加载 amdxc64.dll
; true 或 false - 默认 (auto) 为 false
Fsr4DoNotLoadAmdxc64=auto

; 表示输入颜色资源使用非线性色彩空间
; 可能提升 FSR4 画质
; true 或 false - 默认 (auto) 为 false
FsrNonLinearColorSpace=auto

; 表示输入颜色资源包含感知 sRGB 颜色
; 可能提升 FSR4 画质
; true 或 false - 默认 (auto) 为 false
FsrNonLinearSRGB=auto

; 表示输入颜色资源包含感知 PQ 颜色
; 可能提升 FSR4 画质
; true 或 false - 默认 (auto) 为 false
FsrNonLinearPQ=auto

; 更新 DirectX 12 Agility SDK
; 在 2077 等老游戏的 Windows 10 上启用 FSR4
; 你必须把 D3D12_OptiScaler 文件夹复制到 OptiScaler 文件夹!
; true 或 false - 默认 (auto) 为 false
FsrAgilitySDKUpgrade=auto



; -------------------------------------------------------
[DLSS]
; -------------------------------------------------------
; 启用对原始 NVNGX 的调用
; true 或 false - 默认 (auto) 为 true
Enabled=auto

; 设为 true 以启用自定义渲染预设覆盖
; true 或 false - 默认 (auto) 为 false
RenderPresetOverride=auto

; 画质设置对应的渲染预设
; 取决于 DLSS 版本, 但最新顺序为
; 0 = 默认 | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E | 6 = F | 7 = G
; 8 = H | 9 = I | 10 = J | 11 = K | 12 = L | 13 = M | 14 = N | 15 = O
; 默认 (auto) 为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto

; NGX 使用通用 appid, 修复 OptiScaler 预设覆盖在某些游戏不生效的问题
; true 或 false - 默认 (auto) 为 false
UseGenericAppIdWithDlss=auto



; -------------------------------------------------------
[DLSSD]
; -------------------------------------------------------
; 设为 true 以启用自定义渲染预设覆盖
; true 或 false - 默认 (auto) 为 false
RenderPresetOverride=auto

; 画质设置对应的渲染预设
; 取决于 DLSSD 版本, 但最新顺序为
; 0 = 默认 | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E
; 默认 (auto) 为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto



; -------------------------------------------------------
[NvngxFG]
; -------------------------------------------------------
; 修复 Windows 下 AMD 显卡某些游戏 (大多为非 UE) 的画面异常
; 可能造成卡顿, 建议仅在必要时且被提及时使用
; true 或 false - 默认 (auto) 为 false
MakeDepthCopy=auto

; 接受任意标志组合, 例如 0x14100000
; 参考 https://github.com/artur-graniszewski/dlss-enabler-main/blob/a92464d468eb0d91ae17befa66c6bf6229f20b9f/Utils/DlssgProxy.cpp#L1033
; 任意标志组合 - 默认 (auto) 为 0x10000000 (IGNORE_UI_TEXTURE)
DispatchFlags = auto

; 控制设置给 DLSSG.ShowDebug 的值
; 似乎只显示插值后的帧
; true 或 false - 默认 (auto) 为 false
ShowDebug = auto

; 禁用将 hudless 资源发送给 DLSSG
; 某些 DispatchFlags 组合可能需要, 见参考
; true 或 false - 默认 (auto) 为 false
DisableHudless = auto



; -------------------------------------------------------
[Libraries]
; -------------------------------------------------------
; OptiScaler 查找以下 dll 文件的主文件夹
; 默认为 .\OptiScaler
OptiDllPath=auto

; 以下选项可按 dll 覆盖路径
; -----------------------------------------

; nvngx.dll 或 _nvngx.dll
NvngxPath=auto

; nvngx_dlss.dll
NvngxDlssPath=auto

; nvapi64.dll 或 fakenvapi.dll
NvapiPath=auto
                     
; amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll
FfxDx12Path=auto

; amd_fidelityfx_upscaler_dx12.dll
FfxDx12SRPath=auto

; amd_fidelityfx_framegeneration_dx12.dll
FfxDx12FGPath=auto

; amd_fidelityfx_denoiser_dx12.dll
FfxDx12RRPath=auto

; amd_fidelityfx_radiancecache_dx12.dll
FfxDx12RCPath=auto

; amd_fidelityfx_vk.dll
FfxVkPath=auto

; libxess.dll
XeSSPath=auto

; libxess_fg.dll
XeFGPath=auto

; libxell.dll
XeLLPath=auto

; libxess_dx11.dll
XeSSDx11Path=auto

; 此路径将在初始化时添加到 Nvngx 的路径中
NvngxFeaturePath=auto



; -------------------------------------------------------
[Menu]
; -------------------------------------------------------
; 启用新的 Overlay ImGui 菜单
; 没有此选项 OptiScaler 将禁用所有 FG 功能
; true 或 false - 默认 (auto) 为: OptiScaler 是 nvngx.dll 时 false, 否则 true
OverlayMenu=auto

; 游戏内 ImGui 菜单缩放
; 0.5 到 2.0 - 默认 (auto) 为 1.0, 低于 900p 时会自动降低
Scale=auto

; 打开菜单的快捷键
; 所有按键码值可在此地址查询
; 将 Description 与 key Value 对照
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x2D 即 VK_INSERT/Insert 键, 旧默认键为 0x24 -> VK_HOME/Home 键
; 如果想用例如 VK_BACK/Backspace 键, 即 0x08 - 设置 ShortcutKey=0x08
; -1 -> 不设置快捷键
ShortcutKey=auto

; 将缩放比范围扩展到 0.1 - 6.0
; true 或 false - 默认 (auto) 为 false
ExtendedLimits=auto

; 菜单使用高质量字体
; 可能多用显存
; 如果 Vulkan 下看到黑色覆盖层或发生菜单相关崩溃, 尝试禁用
; true 或 false - 默认 (auto) 为 true
UseHQFont=auto

; 仅控制字体大小, 不影响其他样式元素
; 通过 TTFFontPath 使用自定义字体时最有用
; 浮点数 - 默认 (auto) 为 14.0
FontSize=auto

; 用作 HQ 字体的字体路径, 需要 UseHQFont=true
; 最好使用等宽字体
; 路径示例: C:\\Windows\\Fonts\\comic.ttf
; 默认 (auto) 为随 OptiScaler 捆绑的 Hack-Regular
TTFFontPath=auto

; 禁用启动闪屏信息
; true 或 false - 默认 (auto) 为 false
DisableSplash=auto

; 界面语言
; 0 = 英文, 1 = 简体中文
; 默认 (auto) 为 1 (简体中文), 可在菜单底栏修改
Language=auto

; 启用 FPS 覆盖层
; true 或 false - 默认 (auto) 为 false
ShowFps=auto

; 游戏内 FPS 覆盖层缩放
; 0.5 到 2.0 - 默认 (auto) 为使用与菜单相同的缩放
FpsScale=auto

; FPS 覆盖层位置
; 0 = 左上 | 1 = 右上 | 2 = 左下 | 3 = 右下
; 0 到 3 - 默认 (auto) 为 0
FpsOverlayPos=auto

; FPS 覆盖层类型
; 0 = 仅 FPS | 1 = 简单 | 2 = 详细 | 3 = 详细 + 图表 | 4 = 完整 | 5 = 完整 + 图表 | 6 = Reflex 计时
; 0 到 6 - 默认 (auto) 为 0
FpsOverlayType=auto

; FPS 覆盖层快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x21 -> VK_PRIOR/PageUp 键
; -1 -> 不设置快捷键
FpsShortcutKey=auto

; FPS 覆盖层类型切换快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x22 -> VK_NEXT/PageDown 键
; -1 -> 不设置快捷键
FpsCycleShortcutKey=auto

; 启用横向 FPS 覆盖层布局
; true 或 false - 默认 (auto) 为 false
FpsOverlayHorizontal=auto

; FPS 覆盖层背景不透明度
; 0.0 到 1.0 - 默认 (auto) 为 0.4
FpsOverlayAlpha=auto

; FG 启用/禁用快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x23 -> VK_END/End 键
; -1 -> 不设置快捷键
FGShortcutKey=auto

; 覆盖层使用主题颜色
; true 或 false - 默认 (auto) 为 false
OverlaysUseTheme=auto

; 菜单启用浅色主题
; true 或 false - 默认 (auto) 为 false
LightTheme=auto

; 菜单强调色
; 菜单强调色的 R/G/B 浮点颜色值
; 0.0 到 1.0 - 默认 (auto) R: 0.0, G: 0.4, B: 0.77 (蓝色)
AccentColorR=auto
AccentColorG=auto
AccentColorB=auto

; 菜单背景色
; 菜单强调色的 R/G/B 浮点颜色值
; 0.0 到 1.0 - 默认 (auto) R: 0.0, G: 0.0, B: 0.0 (黑色)
BGColorR=auto
BGColorG=auto
BGColorB=auto

; 菜单背景不透明度
; 0 为全透明, 1 为不透明
; 0.0 到 1.0 - 默认 (auto) 0.99
BGColorA=auto




; -------------------------------------------------------
[Spoofing]
; -------------------------------------------------------
; 要伪装的 VendorID
; 0x10de = Nvidia | 0x8086 = Intel | 0x1002 = AMD
; 整数值 - 默认 (auto) 为 0x10de
SpoofedVendorId=auto

; 要伪装的 DeviceID
; 0x2684 = 4090 | 0xE20B = B580 | 0x7550 = 9070 XT
; 整数值 - 默认 (auto) 为 0x2684 (4090)
SpoofedDeviceId=auto

; 被伪装的目標 VendorID
; 整数值 - 默认 (auto) 为 all (全部)
TargetVendorId=auto

; 被伪装的目標 DeviceID
; 默认 (auto) 为 all (全部)
TargetDeviceId=auto

; 伪装的显卡名称
; NVIDIA GeForce RTX 4090 | Intel(R) Arc(TM) B580 Graphics | AMD Radeon RX 9070 XT
; 默认 (auto) 为 NVIDIA GeForce RTX 4090
SpoofedGPUName=auto

; 为 Streamline 启用 GPU 伪装, 即使游戏的其余部分禁用了 Dxgi 伪装
; 通常允许不伪装整个游戏就使用 Fakenvapi, 有时还能让 DLSS/DLSSG 出现
; true 或 false - 默认 (auto) 为 true
StreamlineSpoofing=auto

; 为 DXGI 启用 Nvidia GPU 伪装 (可在上方改为伪装其他厂商)
; true 或 false - 默认 (auto) 为 AMD/Intel 时 true, Nvidia 时 false
Dxgi=auto

; 使用包装代替 hook DxgiFactory
; 可能引起问题, 也可能帮助 Nvidia 显卡与其他 mod 共存
; true 或 false - 默认 (auto) 为 false
DxgiFactoryWrapping=auto

; 当调用者方法在列表中时跳过 DXGI GPU 伪装 (例如: slInit|slGetPluginFunction|nvapi_QueryInterface)
; 注意这会使后续调用全部不伪装, 且在 Linux 上无效
; 方法名用竖线 "|" 分隔 - 默认 (auto) 为禁用
DxgiBlacklist=auto

; 为 DXGI 伪装显存容量
; 伪装的显存容量 (GB) - 默认 (auto) 为禁用
DxgiVRAM=auto

; 为 Vulkan 启用 Nvidia GPU 伪装 (可在上方改为伪装其他厂商)
; true 或 false - 默认 (auto) 为 false
Vulkan=auto

; 为 Vulkan 启用 Nvidia 扩展伪装
; true 或 false - 默认 (auto) 为 false
VulkanExtensionSpoofing=auto

; 为 Vulkan 伪装显存容量
; 伪装的显存容量 (GB) - 默认 (auto) 为禁用
VulkanVRAM=auto

; 启用硬件加速 GPU 计划 (HAGS) 伪装
; Nukem 的 mod 需要, 也让 RTX40xx 系列用户无需开启 HAGS 就能用 DLSSG
; true 或 false - 默认 (auto) 为 false, 除非启用了 DLSSG mod
SpoofHAGS=auto

; 启用覆盖请求的 D3D 特性级别
; true 或 false - 默认 (auto) 为 false
D3DFeatureLevel=auto

; 防止 UE 游戏出现 DirectX12 不支持错误
; 在 Intel 显卡启用伪装时
; true 或 false - 默认 (auto) 为 false
UEIntelAtomics=auto

; 在注册表层伪装 Vendor ID、Device ID 和驱动版本
; true 或 false - 默认 (auto) 为 false
Registry=auto

; 要在注册表伪装的驱动版本
; 字符串 - 默认 (auto) 为 32.0.15.9155 (Nvidia)
RegistryDriver=auto

; 在 User32 层伪装 Vendor ID、Device ID
; true 或 false - 默认 (auto) 为 false
User32=auto



; -------------------------------------------------------
[Plugins]
; -------------------------------------------------------
; 查找同名插件 (dxgi.dll, winmm.dll 等) 的路径
; 默认为 OptiDllPath 下的插件文件夹 ".\OptiScaler\plugins\"
Path=auto

; 让 OptiScaler 加载 plugins 文件夹中的 *.asi 文件
; true 或 false - 默认 (auto) 为 false
LoadAsiPlugins=auto

; 注入 plugins 文件夹中延迟加载的 *.asi 文件前的延迟
; 要延迟加载 ASI 插件, 在文件名扩展名前加 -loadlate, 例如 "myplugin-loadlate.asi"
; 秒为单位的整数值 - 默认 (auto) 为 30
LateAsiPluginsDelay=auto

; 从游戏 exe 文件夹加载 SpecialK64.dll
; 请在 SpecialK64.dll 旁边创建一个空的 SpecialK.dxgi 文件
; 用于设置 SpecialK 的工作模式, 否则它不会被激活
; 由于稳定性问题, 启用 OPTIFG、SL 的 DLSSG 或 FSR-FG 输入时不会加载
; true 或 false - 默认 (auto) 为 false
LoadSpecialK=auto

; 从游戏 exe 文件夹加载 Reshade64.dll
; 将 Reshade dll 重命名为 ReShade64.dll, 放在 OptiScaler 旁边并设为 true
; true 或 false - 默认 (auto) 为 false
LoadReshade=auto

; 为所有检测到的 RDNA 2 显卡加载自定义 amdxc64.dll
; OptiScaler 从 OptiDllPath 加载, 例如 ".\OptiScaler\amdxc64.dll"
; true 或 false - 默认 (auto) 为 false
LoadCustomAmdxc64OnRdna2=auto

; -------------------------------------------------------
[fakenvapi]
; -------------------------------------------------------
; nvapi64.dll 缺失时使用 fakenvapi。
; fakenvapi 替换 nvapi 调用, 使 AntiLag 2 或 XeLL 等功能能替代 Reflex
; 有时也是让 DLSS/DLSSG 出现的必要条件
; true 或 false - 默认 (auto) 为 true
UseFakenvapi=auto

; 允许 XeLL 在非 Intel 显卡上无 FG 时工作, 需要更新的 libxell + libxess_fg
; 禁用 FG 选项
; true 或 false - 默认 (auto) 为 false
ForceXeLL=auto

; 即使有更好选项也尝试使用 LatencyFlex
; 使用 XeFG 时不生效
; true 或 false - 默认 (auto) 为 false
ForceLatencyFlex=auto

; 控制 latencyflex 的工作方式
; 0 = 保守
; 1 = 激进, 会改善延迟, 但某些情况下 fps 下降可能超过预期
; 2 = 使用 reflex 帧 id, 部分游戏不兼容 (如赛博朋克), 会回退到激进模式
; 默认 (auto) 为 0
LatencyFlexMode=auto

; 强制 Reflex 状态, 适用于只有配合 DLSSG 才启用 Reflex、且没有独立 Reflex 开关的游戏
; 0 - 跟随游戏内设置, 1 - 强制禁用, 2 - 强制启用
; 默认 (auto) 为 0
ForceReflex=auto



; -------------------------------------------------------
[NvApi]
; -------------------------------------------------------
; 禁用 FlipMetering
; 修复使用 NukemFG 时 Nvidia Flip Metering 导致的过粗帧时间曲线, 需要 Fakenvapi 才能生效
; true 或 false - 默认 (auto) 为 Nvidia 时 false, 其他 true
DisableFlipMetering=auto



; -------------------------------------------------------
[Dx11withDx12]
; -------------------------------------------------------
; 延迟 D11wDx12 功能创建时的一些操作以提高兼容性
; true 或 false - 默认 (auto) 为 false
UseDelayedInit=auto

; 优先使用 D3D11_RESOURCE_MISC_SHARED, 它更底层
; 且性能略好, 但兼容性可能更差
; true 或 false - 默认 (auto) 为 true
DontUseNTShared=auto



; -------------------------------------------------------
[Hooks]
; -------------------------------------------------------
; 提前 hook 内核方法
; 可能引起兼容性问题!!!
; true 或 false - 默认 (auto) 为 false
EarlyHooking=auto

; 跳过 hook 本地 nvngx 文件, 只在注册表层 hook nvngx
; Uniscaler + FG 需要
; true 或 false - 默认 (auto) 为 false
HookOriginalNvngxOnly=auto

; 只 hook ntdll.dll 方法, 跳过 kernel32.dll 和 kernelbase.dll 的 hook
; true 或 false - 默认 (auto) 为 true
UseNtdllHooks=auto



; -------------------------------------------------------
[Sharpness]
; -------------------------------------------------------
; 可选项:
; RCAS - AMD 的鲁棒对比度自适应锐化
; DA - 为锐化启用基于深度的边缘检测。
;      减弱物体边界处的锐化以防止光晕和伪影。
;      物体越远, 应用的锐化越多 (上限 1.0)
;      推荐用于几何复杂或放大的场景。
; LCDA - 上述 DA 的局部对比度版本
; rcas, da 或 lcda - 默认 (auto) 为 rcas
Shader=auto

; 用固定锐化值覆盖 DLSS Sharpness 参数
; true 或 false - 默认 (auto) 为 false
OverrideSharpness=auto

; 锐化强度,
; 取值范围 0.0 到 1.0 (使用上限时为 RCAS 1.3) - 默认 (auto) 为 0.3
Sharpness=auto



; -------------------------------------------------------
[OutputScaling]
; -------------------------------------------------------
; 为 Dx12 及 Dx11wDx12 后端启用输出缩放 (Output Scaling) 选项
; true 或 false - 默认 (auto) 为 false
Enabled=auto

; 输出缩放比例
; 0.5 - 3.0 - 默认 (auto) 为 1.5
Multiplier=auto

; 输出缩放使用的降采样器
; 0 = FSR1 | 1 = Bicubic | 2 = Catmull-Rom | 3 = Lanczos2 | 4 = Lanczos3 | 5 = Kaiser2 | 6 = Kaiser3 | 7 = MAGIC
; 0 到 7 - 默认 (auto) 为 0 (FSR1)
Downscaler=auto



; -------------------------------------------------------
[CAS]
; -------------------------------------------------------
; 启用 RCAS 锐化
; true 或 false - 默认 (auto) 为 false
Enabled=auto

; 启用运动锐化
; true 或 false - 默认 (auto) 为 false
MotionSharpnessEnabled=auto

; 锐化会根据运动幅度增加或减少
; 取值范围 -1.3 到 1.3 - 默认 (auto) 为 0.4
MotionSharpness=auto

; 像素移动多少后才应用运动锐化
; 0.0 - 100.0 - 默认 (auto) 为 0.0
MotionThreshold=auto

; 像素移动多少时达到最大运动锐化值
; MotionThreshold 与此值之间的数值将用于缩放锐化值
; 0.0 - 100.0 - 默认 (auto) 为 10.0
MotionScaleLimit=auto

; 启用基于对比度的锐化
; 提高高对比度区域的锐度。
; true 或 false - 默认 (auto) 为 false
ContrastEnabled=auto

; 基于对比度的锐化值
; 值越高, 高对比度区域的锐度越高。
; 高锐化值配合高对比度锐化值可能引起画面 GLITCH !!!
; 0.0 - 2.0  - 默认 (auto) 为 0.0
Contrast=auto

; 为运动/DA 锐化启用调试高亮
; 增加的锐化偏红, 减弱的锐化偏绿
; 深度感知锐化中检测到的边缘显示蓝色
; true 或 false - 默认 (auto) 为 false
SharpenerDebug=auto

; 控制锐化在深度边缘被减弱的程度。
; 较高的值更激进地阻止物体边界处的锐化 (减少光晕)。
; 较低的值允许更多锐化跨越边缘 (更锐利, 但风险更大)。
; 2.0 - 600.0  - 默认 (auto) 为 4.0
DADepthScale=auto

; 在边缘检测前忽略微小的深度差异。
; 较高的值减少轻微深度变化带来的噪点和闪烁。
; 较低的值保留精细细节, 但可能对深度噪点产生反应。
; 0.005 - 0.03  - 默认 (auto) 为 0.01
DADepthBias=auto

; 将最终图像钳制到 [0, 1] 范围。
; 防止过冲伪影, 如明亮光晕或负颜色。
; LDR 管线推荐; HDR 视色调映射情况可选。
; true 或 false - 默认 (auto) 为 false
DAClampOutput=auto



; -------------------------------------------------------
[Magnifier]
; -------------------------------------------------------
; 启用放大镜
; 默认仅在菜单可见时显示, 并跟随光标
; true 或 false - 默认 (auto) 为 false
Enabled=auto

; 放大镜半径 (屏幕高度的百分比)
; 浮点数 - 默认 (auto) 为 15.0
Size=auto

; 放大镜放大倍数
; 2 - 20 - 默认 (auto) 为 4
ZoomFactor=auto

; 放大镜黑边宽度 (屏幕高度的百分比)
; 0.0 - 2.0 - 默认 (auto) 为 0.3
BorderSize=auto

; 放大镜相对鼠标位置的位置偏移 (像素)
; -1000 - 1000 - 默认 (auto) 为 0
CursorOffsetX=auto
CursorOffsetY=auto

; 放大镜的静态位置 (屏幕的百分比)
; 两个值都设置后放大镜切换到静态模式
; 静态模式下放大镜始终可见, 即使菜单不可见
; 0 - 100 - 默认 (auto) 为无
StaticPosX=auto
StaticPosY=auto



; -------------------------------------------------------
[Log]
; -------------------------------------------------------
; 是否创建日志文件
; true 或 false - 默认 (auto) 为 false
LogToFile=auto

; 文件日志详细级别
; 0 = Trace / 1 = Debug / 2 = Info / 3 = Warning / 4 = Error
; 默认 (auto) 为 0 = Trace
LogLevel=auto

; 输出日志到控制台 (出于性能考虑日志级别固定为 2 (Info))
; true 或 false - 默认 (auto) 为 false
LogToConsole=auto

; 输出日志到 NVNGX API
; true 或 false - 默认 (auto) 为 false
LogToNGX=auto

; 输出日志到 Debug 输出
; true 或 false - 默认 (auto) 为 false
LogToDebug=auto

; 打开控制台窗口显示日志
; true 或 false - 默认 (auto) 为 false
OpenConsole=auto

; 设为 false 时每次 OptiScaler 会话创建新日志文件
; true 或 false - 默认 (auto) 为 true
SingleFile=auto

; 自定义日志文件名
; 也可以为日志指定自定义*路径*
; 默认 (auto) 为当前文件夹的 OptiScaler.log
LogFileName=auto

; 启用异步日志
; true 或 false - 默认 (auto) 为 true
LogAsync=auto

; 异步日志线程数
; 1 - 8 - 默认 (auto) 为 1
LogAsyncThreads=auto



; -------------------------------------------------------
[InitFlags]
; -------------------------------------------------------
; 强制在初始化标志中加入 ENABLE_AUTOEXPOSURE
; 某些 Unreal Engine 游戏需要, 修复颜色问题 (尤其是暗部)
; true 或 false - 默认 (auto) 为 DLSS 的值
AutoExposure=auto

; 强制在初始化标志中加入 HDR_INPUT_COLOR
; true 或 false - 默认 (auto) 为 DLSS 的值
HDR=auto

; 强制在初始化标志中加入 INVERTED_DEPTH
; true 或 false - 默认 (auto) 为 DLSS 的值
DepthInverted=auto

; 强制在初始化标志中加入 JITTERED_MV
; true 或 false - 默认 (auto) 为 DLSS 的值
JitterCancellation=auto

; 强制在初始化标志中加入 HIGH_RES_MV
; true 或 false - 默认 (auto) 为 DLSS 的值
DisplayResolution=auto

; 强制从初始化标志中移除 RESPONSIVE_PIXEL_MASK
; true 或 false - 默认 (auto) 为 true
DisableReactiveMask=auto



; -------------------------------------------------------
[UpscaleRatio]
; -------------------------------------------------------
; 设为 true 以启用内部分辨率覆盖
; true 或 false - 默认 (auto) 为 false
UpscaleRatioOverrideEnabled=auto

; 设置强制的放大比例值
; 默认 (auto) 为 1.3
UpscaleRatioOverrideValue=auto



; -------------------------------------------------------
[QualityOverrides]
; -------------------------------------------------------
; 设为 true 以启用自定义画质模式覆盖
; true 或 false - 默认 (auto) 为 false
QualityRatioOverrideEnabled=auto

; 为每个画质模式设置自定义放大比例
;
; 默认 (auto) 值:
; DLAA					: 1.0
; Ultra Quality         : 1.3
; Quality               : 1.5
; Balanced              : 1.7
; Performance           : 2.0
; Ultra Performance     : 3.0
QualityRatioDLAA=auto
QualityRatioUltraQuality=auto
QualityRatioQuality=auto
QualityRatioBalanced=auto
QualityRatioPerformance=auto
QualityRatioUltraPerformance=auto



; -------------------------------------------------------
[DRS]
; -------------------------------------------------------
; 设为 true 以启用将 DRS 最低分辨率限制为渲染分辨率
; true 或 false - 默认 (auto) 为 false
DrsMinOverrideEnabled=auto

; 设为 true 以启用将 DRS 最高分辨率限制为渲染分辨率
; true 或 false - 默认 (auto) 为 false
DrsMaxOverrideEnabled=auto



; -------------------------------------------------------
[HDR]
; -------------------------------------------------------
; 强制 HDR 色彩空间
; true 或 false - 默认 (auto) 为 false
ForceHDR=auto

; 使用 HDR10
; 使用 DXGI_FORMAT_R10G10B10A2_UNORM 代替 DXGI_FORMAT_R16G16B16A16_FLOAT
; true 或 false - 默认 (auto) 为 false
UseHDR10=auto

; 跳过设置 HDR 色彩空间
; true 或 false - 默认 (auto) 为 false
SkipColorSpace=auto



; -------------------------------------------------------
[V-Sync]
; -------------------------------------------------------
; 启用垂直同步 (V-Sync) 控制
; true 或 false - 默认 (auto) 为 false
OverrideVsync=auto

; 强制垂直同步值
; true 或 false - 默认 (auto) 为未选择
ForceVsync=auto

; 垂直同步间隔值
; 0 到 3 - 默认 (auto) 为未选择
SyncInterval=auto



; -------------------------------------------------------
[Anisotropy]
; -------------------------------------------------------
; 覆盖纹理的最大各向异性/各向异性过滤
; 2, 4, 8, 16 - 默认 (auto) 为禁用
AnisotropyOverride=auto

; 将比较过滤器改为各向异性
; true 或 false - 默认 (auto) 为 true
ModifyComparison=auto

; 将最小/最大过滤器改为各向异性
; true 或 false - 默认 (auto) 为 true
ModifyMinMax=auto

; 点过滤不覆盖
; true 或 false - 默认 (auto) 为 true
SkipPointFilter=auto



; -------------------------------------------------------
[Mipmap]
; -------------------------------------------------------
; Mipmap LOD 偏移覆盖值
; -15.0 - 15.0 - 默认 (auto) 为禁用
MipmapBiasOverride=auto

; LOD 偏移使用固定值
; true 或 false - 默认 (auto) 为 false
MipmapBiasFixedOverride=auto

; 将覆盖值作为缩放倍数
; true 或 false - 默认 (auto) 为 false
MipmapBiasScaleOverride=auto

; 覆盖所有纹理的 LOD 偏移 (通常只覆盖 < 0 的值)
; true 或 false - 默认 (auto) 为 false
MipmapBiasOverrideAll=auto



; -------------------------------------------------------
[ProcessFilter]
; -------------------------------------------------------
; 只注入此特定进程 (不区分大小写)
; 示例: TargetProcessName=endfield.exe
; 默认 (auto) 为禁用 (注入所有进程)
TargetProcessName=auto

; 不注入此特定进程 (不区分大小写)
; 进程名用竖线 "|" 分隔 - 默认 (auto) 为
; crashpad_handler.exe 等 - 见 Config.h 中的 ProcessFilter
ProcessExclusionList=auto



; -------------------------------------------------------
[Hotfix]
; -------------------------------------------------------
; 启用从 Github 检查最新版本
; true 或 false - 默认 (auto) 为 true
CheckForUpdate=auto

; 启用阻止 Steam 和 Epic 覆盖层
; 同时阻止 Steam Input
; true 或 false - 默认 (auto) 为 false, 启用 OptiFG 时为 true
DisableOverlays=auto

; 使用手动输入轮询代替 hook WndProc
; 可能帮助无法正确捕获输入的游戏
; 缺点是菜单打开时无法阻止输入
; true 或 false - 默认 (auto) 为 false
ManualInputPolling=auto

; 为 FG swapchain 模拟可等待对象事件信号
; true 或 false - 默认 (auto) 为 false
SimulateWaitableObject=auto

; OptiScaler 将延迟加载 Reshade, 先创建 D3D12 设备
; 此选项可防止 Luma 和部分其他 ReShade mod 的警告/崩溃
; 使用 Luma mod 且此选项启用时
; true 或 false - 默认 (auto) 为 false
CreateD3D12DeviceForLuma=auto

; OptiScaler 会尝试强制高性能 GPU
; true 或 false - 默认 (auto) 为 false
PreferDedicatedGpu=auto

; OptiScaler 只报告第一个高性能 GPU
; true 或 false - 默认 (auto) 为 false
PreferFirstDedicatedGpu=auto

; 将内部分辨率宽高四舍五入到此值的倍数
; 2, 4, 8, 16 ...  - 默认 (auto) 为禁用
RoundInternalResolution=auto

; 跳过 n 帧的放大
; n 为整数 - 默认 (auto) 为禁用
SkipFirstFrames=auto

; 放大后恢复最近使用的计算签名
; true 或 false - 默认 (auto) 为 false
RestoreComputeSignature=auto

; 放大后恢复最近使用的图形签名
; true 或 false - 默认 (auto) 为 false
RestoreGraphicSignature=auto

; 尝试跟踪签名变化以完全恢复
; 对使用 bindless 的游戏有用
; true 或 false - 默认 (auto) 为 false
ExtendedStateRestore=auto

; 为 RCAS、输出缩放和 Mask Bias 使用预编译着色器
; true 或 false - 默认 (auto) 为 true
UsePrecompiledShaders=auto

; 修复 AMD 显卡彩虹色的颜色纹理资源状态 (主要针对 UE 游戏)
; AMD 上的 UE 引擎游戏, Color 设为 4 (D3D12_RESOURCE_STATE_RENDER_TARGET)
ColorResourceBarrier=auto
; AMD 上的 UE 引擎游戏, MotionVector 设为 8 (D3D12_RESOURCE_STATE_UNORDERED_ACCESS)
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto

; 默认 (auto) 为状态修正禁用
; 这些设置定义每个资源的初始
; 状态, 并添加资源屏障以保证正确状态
;
; 常用资源屏障状态
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; 所有状态值可在此查询
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states
